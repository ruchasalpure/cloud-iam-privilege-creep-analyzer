spec_version: "0.1.0"
name: "cloud-iam-privilege-creep-analyzer"
version: "1.0.0"
category: "cybersecurity"
author: "Rucha Salpure"
description: "Correlates multi-cloud cloudtrail logs and policy graphs to strip unused wildcard permissions and synthesize least-privilege IAM roles"
capabilities:
  - "least-privilege-iam-synthesis"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "least-privilege-iam-synthesis"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
