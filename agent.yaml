spec_version: "0.1.0"
name: cloud-iam-privilege-creep-analyzer
version: 1.0.0
description: Correlates multi-cloud cloudtrail logs and policy graphs to strip unused wildcard permissions and synthesize least-privilege IAM roles.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - least-privilege-iam-synthesis
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - cybersecurity
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/cloud-iam-privilege-creep-analyzer"
